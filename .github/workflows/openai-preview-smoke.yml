name: OpenAI Preview checks (bounded)
on:
  push:
    branches: [work-06-openai-preview]
  workflow_dispatch:
concurrency:
  group: lcorals-preview-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Local adapter regression tests
        run: node --test tests/openai-preview.test.cjs
      - name: Four paced synthetic live-mode checks
        run: |
          sleep 65
          node .github/scripts/preview-modes-smoke.cjs
