name: OpenAI Preview age access regression
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: lcorals-preview-validation
  cancel-in-progress: true
jobs:
  age:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Offline backend and age-band tests (no API spend)
        run: node --test tests/openai-preview.test.cjs
