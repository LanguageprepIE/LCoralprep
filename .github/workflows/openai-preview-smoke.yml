name: OpenAI Preview mode tests (bounded)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: lcorals-preview-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Local adapter regression tests
        run: node --test tests/openai-preview.test.cjs
      - name: Four paced Study Mode, roleplay and Polish checks
        run: |
          sleep 35
          node .github/scripts/preview-modes-smoke.cjs
