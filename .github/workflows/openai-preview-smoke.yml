name: OpenAI Preview consistency and Gemini A/B audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: lcorals-preview-validation
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - name: Local adapter regression tests
        run: node --test tests/openai-preview.test.cjs
      - name: Bounded synthetic comparative pedagogy checks
        run: |
          sleep 40
          node .github/scripts/preview-consistency-ab.cjs
