name: OpenAI Preview multilingual safety audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: lcorals-preview-validation
  cancel-in-progress: true
jobs:
  age:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Offline backend and age-band tests (no API spend)
        run: |
          node --check security.js
          node --check .github/scripts/preview-quality-audit.cjs
          node --check .github/scripts/preview-consistency-ab.cjs
          node --test tests/*.test.cjs
      - name: DOM and content regression with temporary test-only dependencies
        run: |
          npm install --prefix /tmp/lcorals-test-deps --no-save --silent jsdom@26.1.0 acorn@8.15.0
          LCORALS_JSDOM_PATH=/tmp/lcorals-test-deps/node_modules/jsdom LCORALS_ACORN_PATH=/tmp/lcorals-test-deps/node_modules/acorn node --test tests/*.test.cjs
