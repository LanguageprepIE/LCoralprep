name: OpenAI Preview pedagogical quality audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: lcorals-preview-validation
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Local adapter tests
        run: node --test tests/openai-preview.test.cjs
      - name: Four fictional answers with scored feedback for manual review
        run: |
          sleep 40
          node .github/scripts/preview-quality-audit.cjs
